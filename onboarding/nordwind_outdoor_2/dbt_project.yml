name: nordwind_outdoor_2
version: '1.0.0'
config-version: 2
profile: nordwind_outdoor_2

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Partner identity (kickoff source_name; dictionary section 5 item 2)
  source_name: nordwind_outdoor_2
  # Owner decision 2026-11-10 (OWNER_DECISIONS.md #1): order times arrive in German local time
  source_time_zone: Europe/Berlin
  # Dev stage over s3://genesis-lab-data-730335510242/data-onboarding/nordwind-outdoor/
  drop_stage: ANALYTICS_DEV.PIPELINES.NORDWIND_OUTDOOR_DROP
  # Production stage, inside the production database
  prod_drop_stage: PIPELINES.NORDWIND_OUTDOOR_2_DROP
  # File format, inside each target's database
  file_format: PIPELINES.NORDWIND_OUTDOOR_2_CSV
  # The orders feed: one dated file per day; merchant.json (reference) never matches
  file_pattern: '.*nordwind_orders_[0-9]{4}-[0-9]{2}-[0-9]{2}[.]csv'

models:
  nordwind_outdoor_2:
    +persist_docs:
      relation: true
      columns: true

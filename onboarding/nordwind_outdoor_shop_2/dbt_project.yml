name: nordwind_outdoor_shop_2
version: "1.0.0"
config-version: 2
profile: nordwind_outdoor_shop_2

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

# Owner decisions and pipeline settings are configuration, never literals in the SQL.
vars:
  source_name: nordwind_outdoor_shop_2
  # Owner decision Q1 (OWNER_DECISIONS.md): order times sent without a zone are Europe/Berlin local time.
  source_time_zone: Europe/Berlin
  # Dev stage over s3://genesis-lab-data-730335510242/data-onboarding/nordwind-outdoor-shop/
  drop_stage: ANALYTICS_DEV.PIPELINES.NORDWIND_OUTDOOR_SHOP_DROP
  # Production stage, inside the production database (created by deploy/snowflake/nordwind_outdoor_shop_2.sql)
  prod_drop_stage: PIPELINES.NORDWIND_OUTDOOR_SHOP_2_DROP
  # File format, inside each target's own database
  file_format: PIPELINES.NORDWIND_OUTDOOR_SHOP_2_CSV
  # One pattern per feed: its dated files and no other file (merchant.json is a reference file, never loaded)
  file_patterns:
    customers_raw: '.*nordwind_customers_[0-9]{4}-[0-9]{2}-[0-9]{2}[.]csv'
    articles_raw: '.*nordwind_articles_[0-9]{4}-[0-9]{2}-[0-9]{2}[.]csv'
    orders_raw: '.*nordwind_orders_[0-9]{4}-[0-9]{2}-[0-9]{2}[.]csv'

models:
  nordwind_outdoor_shop_2:
    +persist_docs:
      relation: true
      columns: true

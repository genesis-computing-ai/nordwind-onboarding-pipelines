version: 2

models:
  - name: order_line
    description: "Standard order lines: one row per order line per source, holding the latest state of the line. Every onboarded source maps into this shape."
    config:
      contract: {enforced: true}
    columns:
      - name: source_name
        data_type: varchar(64)
        constraints: [{type: not_null}]
        description: "Which source the row came from: one short lower-case name per onboarded source, the same on every row of that source."
      - name: order_id
        data_type: varchar(64)
        constraints: [{type: not_null}]
        description: "The order number exactly as the source issues it, trimmed of spaces and upper-cased."
      - name: line_number
        data_type: number(9,0)
        constraints: [{type: not_null}]
        description: "Position of the line within its order, starting at 1. With SOURCE_NAME and ORDER_ID it identifies a row."
      - name: ordered_at_utc
        data_type: timestamp_ntz
        constraints: [{type: not_null}]
        description: "When the order was placed, as a UTC instant. A time the source sends without a zone is converted from the local time zone of the source. That zone is confirmed with the owner of the source once, when the source is onboarded, and never assumed from the data."
      - name: order_date
        data_type: date
        constraints: [{type: not_null}]
        description: "The calendar day the order was placed in the local time zone of the source: the business day daily sales count it on."
      - name: customer_ref
        data_type: varchar(64)
        description: "The customer identifier the source sends, trimmed; NULL for a guest checkout."
      - name: sku
        data_type: varchar(64)
        constraints: [{type: not_null}]
        description: "The article code, trimmed of spaces and upper-cased."
      - name: quantity
        data_type: number(9,0)
        constraints: [{type: not_null}]
        description: "Units ordered on the line; at least 1."
      - name: unit_price
        data_type: number(18,2)
        constraints: [{type: not_null}]
        description: "Price of one unit before discount, in CURRENCY_CODE."
      - name: discount_pct
        data_type: number(5,2)
        constraints: [{type: not_null}]
        description: "Line discount in percent, 0 to 100; 0 when the source gives none."
      - name: net_amount
        data_type: number(18,2)
        constraints: [{type: not_null}]
        description: "QUANTITY x UNIT_PRICE x (1 - DISCOUNT_PCT / 100), rounded half up to 2 decimals."
      - name: currency_code
        data_type: varchar(3)
        constraints: [{type: not_null}]
        description: "ISO 4217 code, upper case (EUR, USD)."
      - name: line_status
        data_type: varchar(16)
        constraints: [{type: not_null}]
        description: "The latest status of the line: one of PLACED, SHIPPED, CANCELLED, RETURNED."
        data_tests:
          - accepted_values:
              values: ['PLACED', 'SHIPPED', 'CANCELLED', 'RETURNED']
      - name: ship_country
        data_type: varchar(2)
        description: "ISO 3166-1 alpha-2 code of the delivery country (DE, AT); NULL when the source gives none."
      - name: source_file
        data_type: varchar(255)
        constraints: [{type: not_null}]
        description: "Name of the file the current values of the row came from, without its folder."
      - name: loaded_at_utc
        data_type: timestamp_ntz
        constraints: [{type: not_null}]
        description: "When the pipeline loaded that file, UTC."

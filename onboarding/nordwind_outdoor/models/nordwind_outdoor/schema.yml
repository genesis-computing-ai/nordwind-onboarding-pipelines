version: 2

models:
  - name: order_line
    description: "Order lines: one row per order line per partner, holding the latest state of the line."
    config:
      contract:
        enforced: true
    columns:
      - name: SOURCE_NAME
        data_type: varchar(64)
        constraints: [{type: not_null}]
        description: "Which partner the row came from: one short lower-case name per onboarded partner, the same on every row of that partner."
      - name: ORDER_ID
        data_type: varchar(64)
        constraints: [{type: not_null}]
        description: "The order number exactly as the partner issues it, trimmed of spaces and upper-cased."
      - name: LINE_NUMBER
        data_type: number(9,0)
        constraints: [{type: not_null}]
        description: "Position of the line within its order, starting at 1. With SOURCE_NAME and ORDER_ID it identifies a row."
      - name: ORDERED_AT_UTC
        data_type: timestamp_ntz
        constraints: [{type: not_null}]
        description: "When the order was placed, as a UTC instant. A time sent without a zone is converted from the partner's local time zone, which is confirmed with the partner's owner and never assumed."
      - name: ORDER_DATE
        data_type: date
        constraints: [{type: not_null}]
        description: "The calendar day the order was placed in the partner's local time zone: the business day daily sales count it on."
      - name: CUSTOMER_REF
        data_type: varchar(64)
        description: "The customer identifier the partner sends, trimmed; NULL for a guest checkout."
      - name: SKU
        data_type: varchar(64)
        constraints: [{type: not_null}]
        description: "The article code, trimmed of spaces and upper-cased."
      - name: QUANTITY
        data_type: number(9,0)
        constraints: [{type: not_null}]
        description: "Units ordered on the line; at least 1."
      - name: UNIT_PRICE
        data_type: number(18,2)
        constraints: [{type: not_null}]
        description: "Price of one unit before discount, in CURRENCY_CODE. A price written with a decimal comma (1.249,50) is read as 1249.50."
      - name: DISCOUNT_PCT
        data_type: number(5,2)
        constraints: [{type: not_null}]
        description: "Line discount in percent, 0 to 100; 0 when the partner gives none. 10, 10% and 10 % all mean 10."
      - name: NET_AMOUNT
        data_type: number(18,2)
        constraints: [{type: not_null}]
        description: "QUANTITY x UNIT_PRICE x (1 - DISCOUNT_PCT / 100), rounded half up to 2 decimals."
      - name: CURRENCY_CODE
        data_type: varchar(3)
        constraints: [{type: not_null}]
        description: "ISO 4217 code, upper case (EUR, USD)."
      - name: LINE_STATUS
        data_type: varchar(16)
        constraints: [{type: not_null}]
        description: "The latest status of the line: one of PLACED, SHIPPED, CANCELLED, RETURNED."
      - name: SHIP_COUNTRY
        data_type: varchar(2)
        description: "ISO 3166-1 alpha-2 code of the delivery country (DE, AT, CH); NULL when the partner gives none."
      - name: SOURCE_FILE
        data_type: varchar(255)
        constraints: [{type: not_null}]
        description: "Name of the file the current values of the row came from, without its folder."
      - name: LOADED_AT_UTC
        data_type: timestamp_ntz
        constraints: [{type: not_null}]
        description: "When the pipeline loaded that file, UTC."

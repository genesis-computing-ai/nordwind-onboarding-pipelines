name: nordwind_outdoor
version: '1.0.0'
config-version: 2
profile: nordwind_outdoor

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

# Owner decisions and pipeline settings, as visible configuration (OWNER_DECISIONS.md in the onboarding mission).
vars:
  source_name: nordwind_outdoor                 # kickoff source_name
  source_time_zone: Europe/Berlin               # owner decision 1: order times are Europe/Berlin local time
  drop_stage: ANALYTICS_DEV.PIPELINES.NORDWIND_OUTDOOR_DROP   # dev stage over s3://genesis-lab-data-730335510242/data-onboarding/nordwind-outdoor/
  prod_drop_stage: PIPELINES.NORDWIND_OUTDOOR_DROP            # production stage, inside the production database
  file_format: PIPELINES.NORDWIND_OUTDOOR_CSV                 # file format, inside each target's database
  file_pattern: '.*nordwind_orders_[0-9]{4}-[0-9]{2}-[0-9]{2}[.]csv'   # the order feed only; merchant.json is reference and never loaded

models:
  nordwind_outdoor:
    +persist_docs:
      relation: true
      columns: true
